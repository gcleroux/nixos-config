keys:
  - &sops_nix age17z388m07ucvsk6t69knt0h8r006m4ejswq8fvfcfyavv45fxr4useyxtm9 # sops-nix
  - &calcifer age172c0stpajtlx7kdrjyelf6am9rr5e6fknac3mkn7ut2tzhc5zq0s7nucse # calcifer
  # nixos-worker-01's host key, needed for hosts/nixos-worker-01/pki/. Obtain it with:
  #   ssh-keyscan -t ed25519 nixos-worker-01 2>/dev/null | ssh-to-age
  # then uncomment it here and below, and run `sops updatekeys` on the pki files.
  # - &nixos_worker_01 age1...

creation_rules:
  - path_regex: ^hosts/nixos-worker-01/pki/
    key_groups:
      - age:
          - *sops_nix
          - *calcifer
          # - *nixos_worker_01
  - key_groups:
      - age:
          - *sops_nix
          - *calcifer
